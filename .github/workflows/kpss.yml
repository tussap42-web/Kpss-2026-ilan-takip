name: KPSS Ilan Takip
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "İşlem"
        type: choice
        options: [preview, find-chats, test-message, scan]
        default: preview
  schedule:
    - cron: '7 6-20 * * *' # Türkiye 09:07–23:07 (UTC+3)
permissions:
  contents: write
concurrency:
  group: kpss-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Testler
        run: python -m unittest discover -s tests -v
      - name: KPSS kontrolü
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          KPSS_WRITE_SUMMARY: '1'
          RUN_MODE: ${{ github.event.inputs.mode || 'scan' }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python main.py --mode "$RUN_MODE"
      - name: Bildirim geçmişini kaydet
        if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.mode == 'scan') }}
        run: |
          if [ ! -f state/seen.json ]; then exit 0; fi
          git add state/seen.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update KPSS notice state"
          git push
