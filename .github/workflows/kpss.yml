name: KPSS Ilan Takip
on:
  push:
    branches: [main]
    paths: ['main.py', 'network.py', 'discovery.py', 'details.py', 'eligibility.py', 'dates_tr.py', 'sources.json', 'config.json', 'requirements.txt', '.github/workflows/kpss.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: "İşlem"
        type: choice
        options: [preview, find-chats, test-message, scan]
        default: preview
      automatic_recovery:
        description: "Otomatik toparlanma: sessiz saatlere uy"
        type: boolean
        default: false
  schedule:
    - cron: '17,47 6-20 * * *' # Türkiye 09:17–23:47; ikinci tetik gecikmelere yedek
permissions:
  contents: write
concurrency:
  group: kpss-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # Kuyruktan çıkınca en güncel teslimat geçmişini al.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Testler
        run: python -m unittest discover -s tests -v
      - name: KPSS kontrolü
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          KPSS_WRITE_SUMMARY: '1'
          KPSS_TRIGGER: ${{ github.event.inputs.automatic_recovery == 'true' && 'schedule' || github.event_name }}
          KPSS_STRICT_SOURCES: '0'
          RUN_MODE: ${{ github.event.inputs.mode || 'scan' }}
          FORCE_RUN: ${{ ((github.event_name == 'workflow_dispatch' && github.event.inputs.automatic_recovery != 'true') || github.event_name == 'push') && '1' || '0' }}
        run: python main.py --mode "$RUN_MODE" | tee scan.log
      - name: Bildirim geçmişini kaydet
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'push' || github.event.inputs.mode == 'scan') }}
        run: |
          if [ ! -f state/seen.json ]; then exit 0; fi
          git add state/seen.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update KPSS notice state"
          git pull --rebase origin main
          git push
      - name: Tarama günlüğü ve teslimat geçmişi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kpss-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            scan.log
            state/seen.json
          retention-days: 7
