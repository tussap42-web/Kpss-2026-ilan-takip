name: Tests
on:
  pull_request:
  push:
    paths: ['**.py', 'requirements.txt', '.github/workflows/tests.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Live preview without Telegram credentials
        # Remote source availability is diagnostic, not a unit-test dependency.
        continue-on-error: true
        shell: bash
        env:
          KPSS_WRITE_SUMMARY: '1'
          KPSS_CONFIG_FILE: config.example.json
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_IDS: ''
        run: python main.py --mode preview | tee preview.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-log
          path: preview.log
